name: VS Code extension

on:
  push:
    branches: [master]
    paths:
      - 'editors/vscode-punchcard/**'
      - 'lib/src/cards/canon_codec.dart'
      - 'lib/src/chars/char_code.dart'
      - '.github/workflows/vscode-ext.yml'
  pull_request:
    paths:
      - 'editors/vscode-punchcard/**'
      - 'lib/src/cards/canon_codec.dart'
      - 'lib/src/chars/char_code.dart'
      - '.github/workflows/vscode-ext.yml'

permissions:
  contents: read

# A newer push to the same branch supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  punchcard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editors/vscode-punchcard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode-punchcard/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: node --check media/punchcard.js
      - run: node --test "test/**/*.test.js"
      - run: npx @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: editors/vscode-punchcard/*.vsix
