# Static analysis for the COMTRAN compiler.
#
# Strategy: enable every usable lint rule in the SDK, then disable the
# exceptions one by one with a written reason. Dart 3.12.2 has 238 usable
# rules; 215 are on below. The "not enabled" block at the end names all 23
# that are off and says why.
#
# Verified against Dart SDK 3.12.2 / package:lints 6.x: no undefined,
# deprecated, removed, incompatible or duplicate rule.
#
# CI already runs `dart analyze --fatal-infos`, so every rule below is a build
# failure, not a hint.

include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  # No excludes. `dart analyze` covers lib/, bin/, test/ and tool/, and all of
  # them must stay clean. editors/vscode-punchcard/ is TypeScript and holds no
  # Dart. The generated lib/src/lexer/message_catalog.dart stays IN scope; its
  # two exceptions are pinned in the file with `ignore_for_file` plus a reason,
  # which `document_ignores` and `unnecessary_ignore` then police.

formatter:
  # The 1962 listing geometry is 80 columns wide; so is the punched card. Keep
  # the source at 80 too. This is the default, pinned so that an SDK change
  # cannot move it silently. `dart format` reads this key.
  page_width: 80
  # trailing_commas is left at the default (automate). Do not set `preserve`:
  # it would put require_trailing_commas and the formatter in conflict.

linter:
  rules:
    - always_declare_return_types
    - always_put_control_body_on_new_line
    - always_put_required_named_parameters_first
    - annotate_overrides
    - annotate_redeclares
    - avoid_annotating_with_dynamic
    - avoid_bool_literals_in_conditional_expressions
    - avoid_catches_without_on_clauses
    - avoid_catching_errors
    - avoid_classes_with_only_static_members
    - avoid_double_and_int_checks
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_equals_and_hash_code_on_mutable_classes
    - avoid_escaping_inner_quotes
    - avoid_field_initializers_in_const_classes
    - avoid_final_parameters
    - avoid_function_literals_in_foreach_calls
    - avoid_futureor_void
    - avoid_implementing_value_types
    - avoid_init_to_null
    - avoid_js_rounded_ints
    - avoid_multiple_declarations_per_line
    - avoid_positional_boolean_parameters
    - avoid_print
    - avoid_private_typedef_functions
    - avoid_redundant_argument_values
    - avoid_relative_lib_imports
    - avoid_renaming_method_parameters
    - avoid_return_types_on_setters
    - avoid_returning_null_for_void
    - avoid_returning_this
    - avoid_setters_without_getters
    - avoid_shadowing_type_parameters
    - avoid_single_cascade_in_expression_statements
    - avoid_slow_async_io
    - avoid_type_to_string
    - avoid_types_as_parameter_names
