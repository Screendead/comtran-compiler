    # ------------------------------------------------------------------
    # NOT ENABLED — 24 rules, each with its reason. Do not add one back
    # without deleting its line here.
    # ------------------------------------------------------------------
    #
    # Deprecated in Dart 3.12.2. The analyzer warns if you enable them.
    # - avoid_null_checks_in_equality_operators   # deprecated
    # - prefer_final_parameters                   # deprecated; use avoid_final_parameters
    # - use_if_null_to_convert_nulls_to_bools     # deprecated
    #
    # Flutter or widget rules. This package is a pure Dart CLI and library.
    # - avoid_unnecessary_containers              # Flutter widget rule
    # - avoid_web_libraries_in_flutter            # Flutter widget rule
    # - diagnostic_describe_all_properties        # Flutter Diagnosticable rule
    # - no_logic_in_create_state                  # Flutter State rule
    # - sized_box_for_whitespace                  # Flutter widget rule
    # - sized_box_shrink_expand                   # Flutter widget rule
    # - sort_child_properties_last                # Flutter widget rule
    # - use_build_context_synchronously           # Flutter BuildContext rule
    # - use_colored_box                           # Flutter widget rule
    # - use_decorated_box                         # Flutter widget rule
    # - use_full_hex_values_for_flutter_colors    # Flutter Color rule
    # - use_key_in_widget_constructors            # Flutter widget rule
    #
    # Losers of a mutually exclusive pair. The analyzer refuses both halves.
    # - always_specify_types                      # 734 hits; the Dart style guide wants inference for obvious locals. omit_obvious_local_variable_types + specify_nonobvious_local_variable_types give the same safety with 138 hits.
    # - omit_local_variable_types                 # 693 hits; too blunt. The narrower omit_obvious_* rule is on instead.
    # - omit_obvious_property_types               # 119 hits; conflicts with type_annotate_public_apis, and lib/comtran.dart exports every src library, so field types are public documentation.
    # - prefer_double_quotes                      # 3796 hits; conflicts with prefer_single_quotes, which matches 4079 of the 4614 string literals already present.
    # - always_use_package_imports                # 100 hits; conflicts with prefer_relative_imports, which already holds everywhere in lib/ at zero cost.
    # - unnecessary_final                         # 998 hits; conflicts with prefer_final_locals, which is the house rule since M1.
    #
    # Judgment calls.
    # - avoid_types_on_closure_parameters         # 95 hits; it deletes type information the author wrote on purpose, and strict-inference already catches inference failure.
    # - public_member_api_docs                    # it forced a no-information doc comment onto every public member. A doc comment is now reserved for a citation or a semantic fact.
    # - use_late_for_private_fields_and_variables # experimental; `late` trades a compile-time null check for a runtime LateInitializationError. A compiler should fail at compile time.
