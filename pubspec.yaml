name: comtran
description: >-
  A reconstruction of IBM COMTRAN (Commercial Translator) — the January 1962
  709/7090 field-test compiler — with a word-exact 7090 emulator, CT Loader,
  and high-level-emulated SYS)/IOC) runtime. Design decisions: docs/design/.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
